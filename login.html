<!DOCTYPE html>
<html lang="cs">
<head>
<script>

  const script = document.createElement('script');
  script.async = true;
  script.src =

  document.head.appendChild(script);

  window.dataLayer = window.dataLayer || [];

  window.gtag = function(){
    dataLayer.push(arguments);
  };

  gtag('js', new Date());
  gtag('config', 'G-NCZM277961');
}

document.addEventListener('DOMContentLoaded', () => {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přihlášení pro členy | JSDH Ostrava - Heřmanice</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  height:100vh;
}

.login-box{
  background:rgba(31,41,55,0.85);
  backdrop-filter:blur(8px);

  padding:40px;
  border-radius:20px;
  width:320px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:15px;

  border:none;
  border-radius:10px;

  box-sizing:border-box;
}

button{
  margin-top:20px;
  width:100%;

  padding:12px;
  border:none;

  border-radius:10px;

  background:#62a5ff;

  color:black;
  font-weight:bold;
  font-size:16px;
  font-family:Arial;

  cursor:pointer;
}

button:hover{
  background:#4b72a7;
}

.error{
  color:#ff6b6b;
  margin-top:15px;
}

.back-btn{
  display:block;
  margin-top:15px;
  padding:12px;

  border-radius:10px;

  background:#374151;
  color:white;

  text-decoration:none;
  font-weight:bold;
}

.back-btn:hover{
  background:#4b5563;
}

#bg-video{
  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,0.45);

  z-index:-1;
}

/* PASSWORD BOX */

.password-box{
  position:relative;
  margin-top:15px;
}

.password-box input{
  padding-right:45px;
  margin-top:0;
}

#togglePassword{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);

  color:#555;
  cursor:pointer;
}

.cookie-banner {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;

  background: rgba(11,18,32,0.97);
  color: white;

  padding: 20px;
  border-radius: 12px;

  z-index: 99999;

  display: none;

  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.cookie-banner.show {
  display: block;
}

.cookie-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.cookie-buttons {
  display: flex;
  gap: 10px;
}

.cookie-btn {
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.cookie-accept {
  background: #22c55e;
  color: white;
}

.cookie-decline {
  background: #475569;
  color: white;
}
</style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
  <source src="dron_hz.mp4" type="video/mp4">
</video>

<div class="login-box">

  <h2>Přihlášení pro členy</h2>

  <!-- PASSWORD BOX -->
  <div class="password-box">

    <input
      type="password"
      id="password"
      placeholder="Zadejte heslo"
    >

    <i class="fa-solid fa-eye" id="togglePassword"></i>

  </div>

  <button onclick="login()">Přihlásit</button>

  <a href="index.html" class="back-btn">
    Zpět
  </a>

  <div class="error" id="error"></div>

</div>

<script>

function login(){

  const password =
    document.getElementById("password").value;

  const memberPassword = "Tatracas32";
  const adminPassword = "Admin2026";

  if(password === memberPassword){

    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("isAdmin", "false");

    window.location.href = "kalendar.html";

  } 
  else if(password === adminPassword){

    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("isAdmin", "true");

    window.location.href = "kalendar.html";

  } 
  else {

    document.getElementById("error").innerText =
      "Nesprávné heslo";
  }
}

/* ZOBRAZENÍ HESLA */

const togglePassword =
  document.getElementById("togglePassword");

const password =
  document.getElementById("password");

password.addEventListener("keydown", function(event){

  if(event.key === "Enter"){

    login();

  }

});

document.addEventListener("keydown", function(event){

  if(event.key === "Escape"){

    const active = document.activeElement;

    if(active && active.id === "password"){
      window.location.href = "index.html";
    }
  }

});

togglePassword.addEventListener("click", function(){

  const type =
    password.getAttribute("type") === "password"
    ? "text"
    : "password";

  password.setAttribute("type", type);

  this.classList.toggle("fa-eye");
  this.classList.toggle("fa-eye-slash");
});

</script>

<script>
function showCookieBanner() {

  if (
    !localStorage.getItem('cookieConsent')
  ) {
    document
      .getElementById('cookieBanner')
      .classList.add('show');
  }
}

function acceptCookies() {

  localStorage.setItem(
    'cookieConsent',
    'accepted'
  );

  document
    .getElementById('cookieBanner')
    .classList.remove('show');

  loadAnalytics();
}

function declineCookies() {

  localStorage.setItem(
    'cookieConsent',
    'declined'
  );

  document
    .getElementById('cookieBanner')
    .classList.remove('show');
}

document.addEventListener(
  'DOMContentLoaded',
  showCookieBanner
);
</script>

<div id="cookieBanner" class="cookie-banner">
  <div class="cookie-content">

    <div>
      Tento web používá analytické cookies služby Google Analytics
      pro měření návštěvnosti.
    </div>

    <div class="cookie-buttons">
      <button
        class="cookie-btn cookie-decline"
        onclick="declineCookies()">
        Odmítnout
      </button>

      <button
        class="cookie-btn cookie-accept"
        onclick="acceptCookies()">
        Přijmout
      </button>
    </div>

  </div>
</div>

</body>
</html>
